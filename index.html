<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="لوحة تكريم نجمات التفاعل على منصة مدرستي — المتوسطة الحادية عشرة والثانوية السابعة">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>نجمات التفاعل في مدرستي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Rubik:wght@500;600;700&family=Tajawal:wght@300;400;500;700&display=swap">
<style id="pagecss">
/* Layout: night-sky observatory. Live constellation of honorees on top, two "guiding moons" (coordinator, principal), then a field of medallions. Deliberately single dark theme. */
:root{
  --night:#06201d; --night-2:#0b2f2b; --panel:#0f3833; --panel-2:#134640;
  --teal:#3fa89a; --mint:#8fe0d2; --gold:#f2c14e; --gold-2:#ffdf8a;
  --fg:#eef7f5; --muted:#9dbdb7; --line:rgba(143,224,210,.18);
  --display:"El Messiri","Tajawal",system-ui,sans-serif;
  --num:"Rubik","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{background:var(--night);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;direction:rtl;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.logo{display:flex;filter:drop-shadow(0 0 18px rgba(143,224,210,.25))}
.logo img{height:58px;width:auto;display:block}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.school{display:grid;line-height:1.35;border-inline-start:1px solid var(--line);padding-inline-start:16px;min-width:0}
.school strong{font-family:var(--display);font-size:clamp(18px,3vw,24px);font-weight:700}
.school small{color:var(--muted);font-size:12.5px}
.coord{margin:0 0 4px;justify-self:start;display:inline-flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:6px 16px;border-radius:16px;background:rgba(6,32,29,.55);border:1px solid rgba(242,193,78,.35);font-size:14px;color:var(--muted)}
.coord b{color:var(--gold-2);font-family:var(--display);font-size:16px}
.coord .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
@media (max-width:560px){.top{flex-wrap:wrap}.top .chip{display:none}}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:13px;color:var(--muted);background:rgba(15,56,51,.6)}

/* sky */
.sky{position:relative;border-radius:28px;overflow:hidden;background:radial-gradient(120% 90% at 80% 0%,#145249 0%,var(--night-2) 45%,var(--night) 100%);border:1px solid var(--line)}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sky-in{position:relative;display:grid;gap:14px;padding:48px clamp(18px,5vw,56px) 40px;min-height:380px;align-content:end;pointer-events:none}
.sky-in>*{pointer-events:auto}
.kicker{font-size:14px;color:var(--mint);margin:0;letter-spacing:.02em}
h1{font-family:var(--display);font-weight:700;font-size:clamp(38px,7.4vw,76px);line-height:1.08;margin:0;text-wrap:balance;max-width:14ch}
h1 span{background:linear-gradient(180deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin:0;max-width:50ch;color:var(--muted);font-weight:300;font-size:17px}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin-top:8px}
.stat b{display:block;font-family:var(--num);font-size:30px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:13px}

/* moons */
.moons{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:22px}
.moon{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:22px;background:linear-gradient(135deg,var(--panel),var(--night-2));border:1px solid var(--line)}
.orb{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:24px;font-weight:700;color:var(--night);background:radial-gradient(circle at 35% 30%,#fff 0%,var(--gold-2) 30%,var(--gold) 70%);box-shadow:0 0 0 6px rgba(242,193,78,.12),0 0 30px rgba(242,193,78,.35)}
.moon.b .orb,.word.b .orb{background:radial-gradient(circle at 35% 30%,#fff 0%,var(--mint) 35%,var(--teal) 75%);box-shadow:0 0 0 6px rgba(143,224,210,.12),0 0 30px rgba(143,224,210,.35)}
.moon small{display:block;color:var(--muted);font-size:13px}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-top:22px}
.word{position:relative;display:grid;gap:16px;align-content:start;padding:24px 24px 26px;border-radius:24px;background:linear-gradient(160deg,var(--panel),var(--night-2));border:1px solid var(--line);overflow:hidden}
.word::after{content:"”";position:absolute;left:18px;top:-18px;font-family:var(--display);font-size:150px;line-height:1;color:var(--gold);opacity:.13;pointer-events:none}
.word.b::after{color:var(--mint)}
.word .who{display:flex;align-items:center;gap:14px}
.word h3{margin:0;font-size:13px;font-weight:500;color:var(--gold)}
.word.b h3{color:var(--mint)}
.word strong{display:block;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.3}
.word blockquote{margin:0;font-size:16.5px;line-height:1.95;color:#d6ebe7;white-space:pre-line;max-width:60ch}
.word .sig{font-size:13px;color:var(--muted)}
.field textarea{border:1px solid var(--line);background:var(--night);border-radius:12px;padding:9px 12px;color:var(--fg);width:100%;min-height:110px;resize:vertical;font:inherit;line-height:1.7}
.moon strong{font-family:var(--display);font-size:22px;font-weight:700}

/* board */
.board{padding-block:44px 64px;display:grid;gap:22px}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between}
.bar h2{font-family:var(--display);font-size:30px;margin:0;line-height:1.2}
.bar h2 small{display:block;font-family:var(--body);font-size:14px;color:var(--muted);font-weight:400}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(15,56,51,.6)}
.seg button{border:0;background:none;padding:6px 16px;border-radius:999px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--night);font-weight:700}
.search{border:1px solid var(--line);background:rgba(15,56,51,.6);border-radius:999px;padding:7px 16px;width:210px;max-width:100%;color:var(--fg)}
.search::placeholder{color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.medal{position:relative;display:grid;justify-items:center;text-align:center;gap:10px;padding:26px 16px 18px;border-radius:24px;background:linear-gradient(180deg,var(--panel) 0%,var(--night-2) 100%);border:1px solid var(--line);transition:transform .25s,border-color .25s,box-shadow .25s}
.medal:hover{transform:translateY(-4px);border-color:rgba(242,193,78,.5);box-shadow:0 18px 40px rgba(0,0,0,.35),0 0 0 1px rgba(242,193,78,.2)}
.disc{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(from 200deg,var(--gold),var(--gold-2),var(--gold),#c9952a,var(--gold));box-shadow:0 0 26px rgba(242,193,78,.28)}
.disc::before{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 40% 30%,var(--panel-2),var(--night))}
.disc svg{position:relative;width:38px;height:38px}
.medal.t .disc{background:conic-gradient(from 200deg,var(--teal),var(--mint),var(--teal),#2b7c71,var(--teal));box-shadow:0 0 26px rgba(143,224,210,.25)}
.medal h3{margin:0;font-family:var(--display);font-size:20px;line-height:1.35;overflow-wrap:anywhere;max-width:100%}
.meta{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:8px;width:100%;margin-top:4px}
.btn{flex:1;border:1px solid var(--line);background:rgba(6,32,29,.5);border-radius:12px;padding:8px 10px;font-size:14px;color:var(--fg);transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--gold);color:var(--gold-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--night);font-weight:700;flex:none}
.btn.gold:hover{background:var(--gold-2);color:var(--night)}

.empty{border:1px dashed rgba(242,193,78,.4);border-radius:24px;padding:40px 20px;text-align:center;color:var(--muted);background:rgba(15,56,51,.35)}
.empty strong{display:block;font-family:var(--display);font-size:24px;color:var(--fg);margin-bottom:6px}

/* editor */
.editor{border-radius:24px;padding:20px;display:grid;gap:14px;background:var(--panel);border:1px solid rgba(242,193,78,.35)}
.editor h3{margin:0;font-family:var(--display);font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>*{flex:1 1 170px;min-width:0}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--night);border-radius:12px;padding:9px 12px;color:var(--fg);width:100%}
.elist{display:grid;gap:6px;max-height:260px;overflow:auto}
.eitem{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px}
.eitem span{min-width:0;overflow-wrap:anywhere}
.eitem button{border:0;background:none;color:#ff9a8a;font-size:13px}
.note{font-size:13px;color:var(--muted);margin:0}

footer{padding-block:22px;color:var(--muted);font-size:13px;text-align:center;border-top:1px solid var(--line)}

/* certificate modal */
.modal{position:fixed;inset:0;background:rgba(3,15,14,.78);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;width:min(880px,100%);display:grid;gap:12px;max-height:100%;overflow:auto}
.sheet canvas{width:100%;height:auto;border-radius:12px;display:block}
.sheet .row .btn{flex:none}

/* sections */
.sect{display:grid;gap:16px}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px}
.shead h2{margin:0;font-family:var(--display);font-size:26px;line-height:1.25}
.shead p{margin:0;color:var(--muted);font-size:14px}
.cnt{font-family:var(--num);font-size:14px;color:var(--gold-2);font-variant-numeric:tabular-nums;border:1px solid rgba(242,193,78,.35);border-radius:999px;padding:2px 12px}

/* podium */
.stages{display:grid;gap:22px}
.stage{display:grid;gap:4px;padding:18px clamp(12px,3vw,26px) 0;border-radius:26px;border:1px solid var(--line);background:radial-gradient(90% 70% at 50% 0%,rgba(242,193,78,.08),transparent 70%),rgba(11,47,43,.45);overflow:hidden}
.stage-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stage-h h3{margin:0;font-family:var(--display);font-size:21px;color:var(--mint)}
.stage-h h3 small{font-size:16px;color:var(--muted);font-weight:500}
.stage-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:620px){.stage{padding-bottom:18px}}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end;padding-top:10px}
.pod{--c:#f2c14e;--c2:#ffe6a3;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-width:0}
.pod.r2{--c:#c9d6db;--c2:#f1f6f8}
.pod.r3{--c:#d39461;--c2:#f3c9a2}
.crown{height:30px;color:var(--c)}
.crown svg{width:40px;height:30px;filter:drop-shadow(0 0 10px rgba(242,193,78,.6))}
.pdisc{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 210deg,var(--c),var(--c2),var(--c),var(--c2),var(--c));box-shadow:0 0 34px color-mix(in srgb,var(--c) 45%,transparent);position:relative}
.pod.r1 .pdisc{width:118px;height:118px}
.pdisc::before{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 40% 30%,var(--panel-2),var(--night))}
.pdisc span{position:relative;font-family:var(--num);font-weight:600;font-size:40px;color:var(--c2);line-height:1}
.pod.r1 .pdisc span{font-size:50px}
.pod h3{margin:4px 0 0;font-family:var(--display);font-size:21px;line-height:1.3;overflow-wrap:anywhere;max-width:100%}
.pod.r1 h3{font-size:25px;color:var(--gold-2)}
.pod.vac h3{color:var(--muted);font-weight:500;font-size:17px}
.pod .meta{min-height:1.6em}
.score{display:inline-flex;align-items:baseline;gap:6px;padding:3px 14px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.score b{font-family:var(--num);font-weight:600;font-size:19px;color:var(--c2);font-variant-numeric:tabular-nums}
.score small{font-size:12px;color:var(--muted)}
.pod .acts{max-width:240px}
.step{width:100%;margin-top:8px;border-radius:18px 18px 6px 6px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,var(--panel)),var(--night-2));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-bottom:0;display:grid;place-items:center;font-family:var(--display);font-size:15px;color:var(--c2)}
.pod.r1 .step{height:120px}.pod.r2 .step{height:84px}.pod.r3 .step{height:58px}
@media (max-width:620px){.podium{grid-template-columns:1fr;gap:18px}.pod.r1{order:-1}.step{display:none}.pod{padding:18px;border-radius:22px;background:linear-gradient(180deg,var(--panel),var(--night-2));border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}}

.board,.sect{grid-template-columns:minmax(0,1fr)}
.railwrap{position:relative;min-width:0}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(190px,24vw,230px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;scrollbar-width:thin;scrollbar-color:rgba(242,193,78,.4) transparent;overscroll-behavior-x:contain}
.rail:focus-visible{outline-offset:6px}
.tile{scroll-snap-align:start;aspect-ratio:1/1;max-width:100%;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:22px;background:linear-gradient(160deg,var(--panel-2),var(--night-2));border:1px solid var(--line);position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.tile:hover{border-color:rgba(242,193,78,.5);transform:translateY(-3px)}
.tile.hi{border-color:rgba(242,193,78,.45);background:radial-gradient(90% 70% at 100% 0%,rgba(242,193,78,.16),transparent 60%),linear-gradient(160deg,var(--panel-2),var(--night-2))}
.tile-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.no{font-family:var(--num);font-weight:600;font-size:22px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(242,193,78,.12);border:1px solid rgba(242,193,78,.4);color:var(--gold-2);font-variant-numeric:tabular-nums}
.tile.hi .no{background:var(--gold);color:var(--night);border-color:var(--gold)}
.sc{font-family:var(--num);font-weight:600;font-size:15px;color:var(--mint);font-variant-numeric:tabular-nums}
.tile h3{margin:auto 0;padding-bottom:22px;font-family:var(--display);font-size:23px;line-height:1.4;text-align:center;text-wrap:balance;overflow-wrap:anywhere}
.tile .meta{margin-top:-4px}
.tile .acts{margin-top:4px}
.tile .btn{padding:6px 8px;font-size:13px}
.tile.slot{border-style:dashed;background:transparent;align-items:center;justify-content:center;opacity:.6}
.tile.slot b{font-size:13px;color:var(--muted);font-weight:400}
.arrow{position:absolute;top:calc(50% - 30px);z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid rgba(242,193,78,.5);background:rgba(6,32,29,.9);color:var(--gold-2);font-size:26px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.arrow.prev{right:-12px}.arrow.next{left:-12px}
.arrow:hover{background:var(--gold);color:var(--night)}
.hint{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.railctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.railctl .btn{flex:none;padding:5px 14px;font-size:13px}
.dup{display:contents}
.rail.auto{scroll-snap-type:none;scrollbar-width:none}
.rail.auto::-webkit-scrollbar{display:none}
.fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:29}
@media (max-width:620px){.arrow{display:none}.rail{grid-auto-columns:62%}}
.slot b{font-family:var(--num);font-size:22px;color:rgba(143,224,210,.35)}

/* shooting star + toast */
.shoot{position:fixed;height:2px;width:140px;pointer-events:none;z-index:30;background:linear-gradient(90deg,rgba(255,223,138,0),var(--gold-2));border-radius:2px}
.spark{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:30;background:var(--gold-2);box-shadow:0 0 8px var(--gold)}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:var(--night);font-weight:700;padding:10px 20px;border-radius:999px;z-index:31;font-size:15px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){.medal,.btn{transition:none}.medal:hover{transform:none}}

function burst(x,y){for(let i=0;i<26;i++){const p=document.createElement('div');p.className='spark';p.style.left=x+'px';p.style.top=y+'px';document.body.appendChild(p);

// auto-scrolling rail (seamless loop over a duplicated set)
let railRaf=0,railPaused=false,railHold=0,railPos=null;
function holdRail(ms){railHold=performance.now()+ms;railPos=null}
function startRail(){
  cancelAnimationFrame(railRaf);const r=$('#rail');if(!r||!r.classList.contains('auto'))return;
  const dup=r.querySelector('.dup');if(!dup||!dup.firstElementChild)return;
  ['pointerenter','touchstart','focusin','wheel'].forEach(ev=>r.addEventListener(ev,()=>holdRail(1e9),{passive:true}));
  ['pointerleave','touchend','focusout'].forEach(ev=>r.addEventListener(ev,()=>holdRail(2500),{passive:true}));
  let last=performance.now(),stepT=0;
  (function tick(now){
    const dt=Math.min(64,now-last);last=now;
    const tiles=r.children,first=tiles[0],copy=dup.firstElementChild;
    const setW=Math.abs(copy.getBoundingClientRect().right-first.getBoundingClientRect().right);
    if(!railPaused&&now>railHold&&setW>0){
      if(railPos===null)railPos=r.scrollLeft;
      if(reduce()){stepT+=dt;if(stepT>3500){stepT=0;railPos-=(first.offsetWidth+14)}}
      else railPos-=dt*0.06;            // RTL: content advances toward negative scrollLeft
      if(railPos<=-setW)railPos+=setW;
      r.scrollLeft=railPos;
    }else if(now<=railHold){ // keep the loop seamless while the user scrolls by hand
      if(Math.abs(r.scrollLeft)>=setW)r.scrollLeft+= (r.scrollLeft<0?setW:-setW);
    }
    if(document.body.contains(r))railRaf=requestAnimationFrame(tick);
  })(last);
}

// fireworks overlay
function fireworks(tx,ty){
  const cv=document.createElement('canvas');cv.className='fw';document.body.appendChild(cv);
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  const c=cv.getContext('2d');c.scale(dpr,dpr);
  const COLS=['#ffdf8a','#f2c14e','#8fe0d2','#ffffff','#ff9fb2','#7cc4ff'];
  const rockets=[],parts=[];
  const launch=(x,y,delay)=>rockets.push({x,y:H+10,tx:x+(Math.random()-.5)*60,ty:y,t:-delay,col:COLS[Math.random()*COLS.length|0]});
  launch(tx,ty,0);
  for(let i=0;i<6;i++)launch(W*(.12+Math.random()*.76),H*(.12+Math.random()*.35),150+i*230);
  const explode=(x,y,col)=>{const n=70+Math.random()*30|0,col2=COLS[Math.random()*COLS.length|0];
    for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.1,sp=2+Math.random()*4.2;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col:i%3?col:col2,dec:.008+Math.random()*.01})}};
  let last=performance.now(),end=last+4200;
  (function f(now){const dt=Math.min(40,now-last)/16.7;last=now;
    c.globalCompositeOperation='destination-out';c.fillStyle='rgba(0,0,0,.28)';c.fillRect(0,0,W,H);c.globalCompositeOperation='lighter';
    for(let i=rockets.length-1;i>=0;i--){const k=rockets[i];k.t+=dt*16.7;if(k.t<0)continue;const p=Math.min(1,k.t/700),e=1-Math.pow(1-p,3);
      const x=k.x+(k.tx-k.x)*e,y=k.y+(k.ty-k.y)*e;c.fillStyle=k.col;c.beginPath();c.arc(x,y,2.4,0,7);c.fill();
      if(p>=1){explode(k.tx,k.ty,k.col);rockets.splice(i,1)}}
    for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.vx*=.985;q.vy=q.vy*.985+.06*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=q.dec*dt;
      if(q.life<=0){parts.splice(i,1);continue}c.globalAlpha=q.life;c.fillStyle=q.col;c.beginPath();c.arc(q.x,q.y,2.6,0,7);c.fill()}
    c.globalAlpha=1;
    if(now<end&&(rockets.length||parts.length))requestAnimationFrame(f);else cv.remove()})(last);
}

// synthesized hand-clapping: a few distinct clappers, each with its own hand "body" tone, in a small room
let actx=null,clappers=null,roomIR=null;
function applause(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    actx=actx||new AC();if(actx.state==='suspended')actx.resume();
    const sr=actx.sampleRate,dur=3.8,len=sr*dur|0;
    const env=t=>Math.min(1,t/.25)*(t>dur-1.1?Math.max(0,(dur-t)/1.1):1);
    if(!clappers){
      clappers=[];
      for(let k=0;k<12;k++){
        const buf=actx.createBuffer(1,len,sr),d=buf.getChannelData(0);
        let t=Math.random()*.22;const per=.2+Math.random()*.09,amp=.6+Math.random()*.4;
        while(t<dur-.04){
          const st=t*sr|0,a=amp*env(t)*(.8+Math.random()*.4);
          // one clap = 2-3 rapid micro-impacts (palm + fingers) then a short decay
          const bursts=2+(Math.random()*2|0);
          for(let bI=0;bI<bursts;bI++){
            const off=st+((bI*(.0009+Math.random()*.0011))*sr|0),ba=a*(1-bI*.28),dec=(.0016+Math.random()*.0012)*sr,n=(.018*sr)|0;
            for(let i=0;i<n&&off+i<len;i++)d[off+i]+=(Math.random()*2-1)*ba*Math.exp(-i/dec);
          }
          t+=per*(.9+Math.random()*.2);
        }
        clappers.push({buf,f:800+Math.random()*1300,q:.9+Math.random()*1.1,pan:Math.random()*1.6-.8});
      }
      // short room reverb impulse
      const irLen=(1.8*sr)|0;roomIR=actx.createBuffer(2,irLen,sr);
      for(let ch=0;ch<2;ch++){const d=roomIR.getChannelData(ch);for(let i=0;i<irLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/irLen,2.2)*(i<sr*.012?0:1)*.6}
    }
    const comp=actx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.knee.value=10;
    const master=actx.createGain();master.gain.value=1.4;comp.connect(master).connect(actx.destination);
    const conv=actx.createConvolver();conv.buffer=roomIR;const wet=actx.createGain();wet.gain.value=.55;conv.connect(wet).connect(comp);
    // hall echo: a clear repeat that fades
    const dl=actx.createDelay(1);dl.delayTime.value=.26;const fb=actx.createGain();fb.gain.value=.38;const eg=actx.createGain();eg.gain.value=.45;
    const ef=actx.createBiquadFilter();ef.type='lowpass';ef.frequency.value=3200;
    dl.connect(ef).connect(fb).connect(dl);ef.connect(eg).connect(comp);
    const now=actx.currentTime+.02;
    for(const c of clappers){
      const src=actx.createBufferSource();src.buffer=c.buf;
      const bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=c.f;bp.Q.value=c.q;
      const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=350;
      const g=actx.createGain();g.gain.value=.5;
      let out=g;if(actx.createStereoPanner){const pn=actx.createStereoPanner();pn.pan.value=c.pan;g.connect(pn);out=pn}
      src.connect(hp).connect(bp).connect(g);out.connect(comp);out.connect(conv);out.connect(dl);
      src.start(now);
    }
  }catch(e){}
}

let raf=0,skyState=null;
function rand(seed){let s=0;for(const ch of seed)s=(s*31+ch.charCodeAt(0))>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

  const box=cv.getBoundingClientRect(),w=box.width,h=box.height,dpr=Math.min(2,devicePixelRatio||1);
  cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  const R=rand('madrasati'),dust=[];for(let i=0;i<Math.round(w*h/2600);i++)dust.push({x:R()*w,y:R()*h,r:R()*1.2+.2,p:R()*6,s:.5+R()*1.5});
  // named stars live in the upper-left (text sits bottom-right in RTL)
  const named=S.stars.length?S.stars:['ن','ج','م','ة','س'].map((c,i)=>({name:'',seed:c+'مدرستي'+i*7,kind:i%2?'teacher':'student'}));
  const pts=named.slice(0,40).map((s,i)=>{const r=rand((s.seed||s.name)+i);return{x:w*(.06+r()*.55),y:h*(.1+r()*.42),k:s.kind,n:s.name,p:r()*6}}).sort((a,b)=>a.x-b.x);
  skyState={pts,w,h};let hover=-1,t=0;
  cv.parentElement.onmousemove=e=>{const b=cv.getBoundingClientRect(),mx=e.clientX-b.left,my=e.clientY-b.top;hover=pts.findIndex(p=>Math.hypot(p.x-mx,p.y-my)<16);if(reduce())draw()};
  cv.parentElement.onmouseleave=()=>{hover=-1;if(reduce())draw()};
  function draw(){
    c.clearRect(0,0,w,h);
    for(const d of dust){c.globalAlpha=.25+.55*(.5+.5*Math.sin(t*d.s+d.p));c.fillStyle='#d9f5ef';c.beginPath();c.arc(d.x,d.y,d.r,0,7);c.fill()}
    c.globalAlpha=.28;c.strokeStyle='#8fe0d2';c.lineWidth=1;c.setLineDash([3,5]);c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke();c.setLineDash([]);
    pts.forEach((p,i)=>{const tw=.75+.25*Math.sin(t*1.6+p.p),col=p.k==='teacher'?'143,224,210':'255,223,138',big=i===hover?1.6:1;
      const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,18*big);g.addColorStop(0,`rgba(${col},${.9*tw})`);g.addColorStop(1,`rgba(${col},0)`);
      c.globalAlpha=1;c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,18*big,0,7);c.fill();
      c.fillStyle='#fff';c.beginPath();c.arc(p.x,p.y,2.2*big,0,7);c.fill();
      c.strokeStyle=`rgba(${col},${.8*tw})`;c.lineWidth=1;c.beginPath();c.moveTo(p.x-9*big,p.y);c.lineTo(p.x+9*big,p.y);c.moveTo(p.x,p.y-9*big);c.lineTo(p.x,p.y+9*big);c.stroke();
      if(i===hover&&p.n){c.font='700 15px "El Messiri", sans-serif';c.direction='rtl';c.textAlign='center';c.fillStyle='#ffdf8a';c.fillText(p.n,p.x,p.y-22)}});
    c.globalAlpha=1;
  }
  (function loop(){draw();t+=.016;if(!reduce()&&document.body.contains(cv))raf=requestAnimationFrame(loop)})();
}

// certificate
const logoImg=new Image();logoImg.src=LOGO;
async function openCert(s){
  const m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-label','شهادة شكر');
  m.innerHTML=`<div class="sheet"><canvas width="1600" height="1130"></canvas><div class="row"><button class="btn gold" id="dl">حفظ الشهادة صورة</button><button class="btn" id="cl">إغلاق</button></div><p class="note" id="dlMsg"></p></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();$('#cl').onclick=close;m.onclick=e=>{if(e.target===m)close()};
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
  const cv=m.querySelector('canvas');await drawCert(cv,s);
  const standalone=!window.claude;
  if(!downloadsNS&&!standalone){$('#dl').hidden=true;$('#dlMsg').textContent='يمكنك أخذ لقطة شاشة للشهادة لحفظها.'}
  const fname='شهادة-'+s.name.replace(/\s+/g,'-')+'.png';
  $('#dl').onclick=()=>cv.toBlob(async b=>{if(!downloadsNS){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='madrasati-certificate-'+(s.id||'1')+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);$('#dlMsg').textContent='تم الحفظ.';return}try{await downloadsNS.save({filename:fname,data:b});$('#dlMsg').textContent='تم الحفظ.'}catch(e){$('#dlMsg').textContent=e&&e.code==='declined'?'أُلغي الحفظ.':'تعذّر الحفظ، يمكنك أخذ لقطة شاشة.'}},'image/png');
  $('#cl').focus();
}
async function drawCert(cv,s){
  try{await Promise.all([document.fonts.load('600 30px "Rubik"','٠١٢٣٤٥٦٧٨٩'),document.fonts.load('700 60px "El Messiri"'),document.fonts.load('400 30px "Tajawal"')])}catch(e){}
  if(!logoImg.complete)await new Promise(r=>logoImg.onload=r);
  const c=cv.getContext('2d'),W=1600,H=1130,N='#0b2f2b',T='#2f7f75',G='#d9a531',D='#14302c';
  c.fillStyle='#fbfaf6';c.fillRect(0,0,W,H);
  // night arch at the top with stars
  c.save();c.beginPath();c.moveTo(0,0);c.lineTo(W,0);c.lineTo(W,250);c.quadraticCurveTo(W/2,400,0,250);c.closePath();
  const g=c.createLinearGradient(0,0,0,380);g.addColorStop(0,'#06201d');g.addColorStop(1,'#145249');c.fillStyle=g;c.fill();c.clip();
  const R=rand(s.name);for(let i=0;i<160;i++){c.globalAlpha=.3+R()*.7;c.fillStyle='#e8fbf6';c.beginPath();c.arc(R()*W,R()*330,R()*2+.4,0,7);c.fill()}
  c.restore();c.globalAlpha=1;
  // logo tile
  const lw=230,lh=lw*logoImg.height/logoImg.width;c.fillStyle='#fff';
  c.beginPath();c.roundRect(W/2-lw/2-22,190,lw+44,lh+30,22);c.fill();c.strokeStyle=G;c.lineWidth=3;c.stroke();
  c.drawImage(logoImg,W/2-lw/2,205,lw,lh);
  c.direction='rtl';c.textAlign='center';const cx=W/2;
  c.fillStyle=T;c.font='700 78px "El Messiri", sans-serif';c.fillText('شهادة شكر وتقدير',cx,480);
  c.fillStyle=D;c.font='400 31px "Tajawal", sans-serif';
  const sn=+s.rank?S[stg(s)==='sec'?'schoolSec':'schoolMid']:S.school;
  c.fillText('تتقدم إدارة '+(sn||'المدرسة')+' ومنسقة منصة مدرستي بخالص الشكر والتقدير',cx,555);
  c.fillText(+s.rank?'للطالبة المتصدرة':(s.kind==='teacher'?'للمعلمة المتميزة':'للطالبة المتميزة'),cx,605);
  c.fillStyle=G;c.font='700 84px "El Messiri", sans-serif';c.fillText(s.name,cx,715);
  c.fillStyle=D;c.font='400 29px "Tajawal", sans-serif';
  if(+s.rank){c.fillText('لحصولها على المركز '+RANKS[+s.rank]+' على مستوى '+(sn||STAGES[stg(s)]),cx,780);c.fillText('في التفاعل مع منصة مدرستي'+(s.score?' بدرجة '+fmt(s.score):'')+(s.grade?' — '+s.grade:''),cx,824);c.fillText('سائلين الله لها دوام التميز · '+S.term,cx,868)}
  else{c.fillText('لتألقها في التفاعل مع منصة مدرستي'+(s.score?' بدرجة '+fmt(s.score):'')+(s.grade?' — '+s.grade:''),cx,790);c.fillText('سائلين الله لها دوام التميز · '+S.term,cx,838)}
  c.font='400 25px "Tajawal", sans-serif';c.fillStyle='#5d7571';
  c.fillText('منسقة منصة مدرستي',W-360,950);c.fillText('مديرة المدرسة',360,950);
  c.fillStyle=N;c.font='700 38px "El Messiri", sans-serif';
  c.fillText('أ. '+S.coordinator,W-360,1005);c.fillText('أ. '+S.principal,360,1005);
  // gold star seal
  c.save();c.translate(cx,985);c.fillStyle=G;c.beginPath();for(let i=0;i<10;i++){const r=i%2?32:72,a=-Math.PI/2+i*Math.PI/5;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath();c.fill();
  c.fillStyle='#fbfaf6';c.beginPath();c.arc(0,0,26,0,7);c.fill();c.fillStyle=G;c.font='700 26px "El Messiri", sans-serif';c.textBaseline='middle';c.fillText('★',0,2);c.restore();
  c.strokeStyle=G;c.lineWidth=2;c.strokeRect(36,36,W-72,H-72);
}
